- name: Sky Request
  scenarios:
    - name: simple request
      input:
        resource:
          origin: "http://localhost:3000"
          name: hello
          bindings:
            name: dan
      assertions:
        - path: $.url.toString()
          type: equal
          expect: "http://localhost:3000/hello/dan"

    - name: method not allowed
      input:
        resource:
          origin: "http://localhost:3000"
          name: hello
          bindings:
            name: dan
        method: delete
      rejects: "sublime: method not allowed"

    - name: set content type
      input:
        resource:
          origin: "http://localhost:3000"
          name: hello
          bindings:
            name: dan
        method: put
        content:
          greeting: Hello, Dan
      assertions:
        - path: ( $.headers.get "content-type" ).format()
          type: equal
          expect: application/json

- name: Sky Response
  scenarios:
    - name: simple response
      input:
        resource:
          origin: "http://localhost:3000"
          name: hello
          bindings:
            name: dan
        status: 200
        content: "Hello Dan"
      assertions:
        - path: $.status
          type: equal
          expect: 200





