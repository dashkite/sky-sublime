resources:

  hello:
    template: /hello/{name}
    methods:
      get:
        response:
          content-type: [ application/vnd.dashkite.greeting+json;version=1 ]
          status: [ 200 ]
      put:
        request:
          content-type: [ application/vnd.dashkite.greeting+json;version=1 ]
        response:
          content-type: [ application/vnd.dashkite.greeting+json;version=1 ]
          status: [ 200 ]
