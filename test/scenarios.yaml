- name: Sky Request
  scenarios:
    - name: simple request
      input:
        resource:
          origin: "http://localhost:3000"
          name: hello
          bindings:
            name: dan
      assertions:
        - path: $.url.toString()
          type: equal
          expect: "http://localhost:3000/hello/dan"

    - name: method not allowed
      input:
        resource:
          origin: "http://localhost:3000"
          name: hello
          bindings:
            name: dan
        method: put
      rejects: "sublime: method not allowed"



