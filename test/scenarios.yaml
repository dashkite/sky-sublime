- name: Sky Request
  scenarios:
    - name: simple request
      input:
        resource:
          origin: "http://localhost:3000"
          name: hello
          bindings:
            name: dan
      assertions:
        - path: $.url.toString()
          type: equal
          expect: "http://localhost:3000/hello/dan"

    - name: method not allowed
      input:
        resource:
          origin: "http://localhost:3000"
          name: hello
          bindings:
            name: dan
        method: delete
      rejects: "sublime: method not allowed"

    - name: set content type
      input:
        resource:
          origin: "http://localhost:3000"
          name: hello
          bindings:
            name: dan
        method: put
        content:
          greeting: Hello, Dan
      assertions:
        - path: ( $.headers.get "content-type" ).format()
          type: equal
          expect: application/vnd.dashkite.greeting+json; version=1

    - name: unsupported content-type
      input:
        resource:
          origin: "http://localhost:3000"
          name: hello
          bindings:
            name: dan
        method: put
        headers:
          content-type: application/json
        content:
          greeting: Hello, Dan
      rejects: "sublime: unsupported content-type"

- name: Sky Response
  scenarios:
    - name: simple response
      input:
        resource:
          origin: "http://localhost:3000"
          name: hello
          bindings:
            name: dan
        status: 200
        content: "Hello Dan"
      assertions:
        - path: $.status
          type: equal
          expect: 200

    - name: set content type
      input:
        request:
          resource:
            origin: "http://localhost:3000"
            name: hello
            bindings:
              name: dan
          method: get
        content:
          greeting: Hello, Dan
      assertions:
        - path: ( $.headers.get "content-type" ).format()
          type: equal
          expect: application/vnd.dashkite.greeting+json; version=1

    - name: unacceptable response
      input:
        request:
          resource:
            origin: "http://localhost:3000"
            name: hello
            bindings:
              name: dan
          method: put
        headers:
          content-type: application/json
        content:
          greeting: Hello, Dan
      rejects: "sublime: unacceptable response"



